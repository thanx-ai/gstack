name: Build CI Image
# Thanx fork: this image was prebaked for the upstream Ubicloud eval runners.
# The fork doesn't run the paid evals on PRs, so this is manual-only — build it
# only if a maintainer is intentionally running the full E2E eval suite.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Copy lockfile + package.json into Docker build context
      - run: cp package.json bun.lock .github/docker/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ci:latest
            ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
